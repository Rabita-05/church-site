<section class="verse-of-the-day">
    <p id="verse-of-the-day">Loading...</p>
</section>

  <script>
    fetch('https://beta.ourmanna.com/api/v1/get/?format=text')
      .then(res => res.text())
      .then(data => {
        document.getElementById('verse-of-the-day').textContent = data;
      })
      .catch(() => {
        document.getElementById('verse-of-the-day').textContent = 'Could not load verse at the moment. Try again later.';
      });

    let currentSlide = 0;
    const slides = document.querySelectorAll('.slide');
    const totalSlides = slides.length;

    setInterval(() => {
      slides[currentSlide].classList.remove('active');
      currentSlide = (currentSlide + 1) % totalSlides;
      slides[currentSlide].classList.add('active');
      }, 2000);

  function toggleDrawer1(card1Element) {
    const drawer1 = card1Element.nextElementSibling;
    drawer1.classList.toggle('active');
  }

  function toggleDrawer(cardElement) {
    const drawer = cardElement.nextElementSibling;
    drawer.classList.toggle('active');
  }
</script>
